# Serving the document engine at /document-engine/.
#
# Reference configuration, derived from upstream's own
# apps/impress/conf/default.conf, which does NOT work as shipped for this
# deployment — see the two notes below. Whoever owns the public Neev proxy owns
# the real file; this is here so the frontend's requirements are written down
# next to the build that makes them.
#
# The static export is mounted at /srv/document-engine. It contains a literal
# `docs/[id]/` directory — Next's pages router emits the dynamic route under its
# bracketed name — which is why the UUID location below rewrites to it rather
# than relying on try_files alone.

location /document-engine/ {
    alias /srv/document-engine/;

    # No fallback to the Neev root. A miss under this prefix is a 404 here, not
    # a request handed to the host application.
    try_files $uri $uri/index.html =404;

    # Upstream sends DENY, which blocks the Neev iframe outright. SAMEORIGIN
    # still refuses cross-origin framing, which is the property worth keeping —
    # the embed is same-origin by design.
    add_header X-Frame-Options SAMEORIGIN always;
}

# A document URL is /document-engine/docs/<uuid>/ and every one of them is
# served by the same exported page.
location ~ "^/document-engine/docs/[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}/?$" {
    alias /srv/document-engine/;
    try_files "docs/[id]/index.html" =404;

    add_header X-Frame-Options SAMEORIGIN always;
}

# Backend, proxied under the same prefix. Three requirements:
#
# 1. Do NOT strip the prefix on the way through unless Django is also told it is
#    mounted there — the frontend asks for /document-engine/api/v1.0/... and the
#    paths must agree at both ends.
# 2. Cookies must be preserved. The collaboration socket authenticates by
#    session cookie and closes a connection carrying none with `4001 No
#    cookies`; see docs/lasuite-docs-preview/README.md.
# 3. Nothing here may also be exposed at the Neev root. There is no /api,
#    /media or /collaboration outside this prefix, and the frontend never asks
#    for one — verified against the built bundle.

location /document-engine/api/ {
    proxy_pass http://docs-backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /document-engine/media/ {
    proxy_pass http://docs-backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /document-engine/collaboration/ {
    proxy_pass http://docs-collaboration;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # Collaboration sockets are long-lived; the default read timeout closes them.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
