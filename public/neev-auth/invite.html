<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accept invitation · Neev</title>
    <link rel="stylesheet" href="/neev-auth/invite.css" />
    <script src="/neev-auth/invite.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Neev</p>
      <h1>Organization invitation</h1>
      <p data-company role="status" aria-live="polite">
        Checking your invitation…
      </p>
      <form hidden>
        <button type="submit">Join this organization</button>
      </form>
      <p role="alert" aria-live="polite"></p>
      <p class="hint">
        You must be signed in with the exact email address that received this
        invitation.
      </p>
      <a data-recovery href="/login">Sign in to Neev</a>
    </main>
  </body>
</html>
