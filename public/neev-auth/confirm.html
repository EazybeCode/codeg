<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirm sign-in · Neev</title>
    <link rel="stylesheet" href="/neev-auth/confirm.css" />
    <script src="/neev-auth/confirm.js" defer></script>
  </head>
  <body>
    <main>
      <p class="eyebrow">Neev</p>
      <h1>Confirm your sign-in</h1>
      <p>This link works only in the browser that requested it.</p>
      <form>
        <button type="submit">Continue securely</button>
      </form>
      <p role="alert" aria-live="polite"></p>
      <p class="hint">
        If this link does not work, request a new email on this device.
      </p>
      <a href="/login">Request a new sign-in link</a>
    </main>
  </body>
</html>
